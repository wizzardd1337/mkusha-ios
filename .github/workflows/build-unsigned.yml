name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build Go static library
        run: |
          cd GoSpoofer
          chmod +x make.sh
          ./make.sh

      - name: Build and Package (unsigned)
        run: |
          set +e
          xcodebuild \
            -project location-spoofer.xcodeproj \
            -scheme location-spoofer \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee "$RUNNER_TEMP/xcode_build.log"
          
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error::Build exit code: $BUILD_EXIT"
            grep -E "(error:|fatal error:|BUILD FAILED|\*\*)" "$RUNNER_TEMP/xcode_build.log" | head -20 | while IFS= read -r l; do
              echo "::error::$l"
            done
            echo "=== LAST 100 LINES OF BUILD LOG ==="
            tail -n 100 "$RUNNER_TEMP/xcode_build.log"
            exit $BUILD_EXIT
          fi

          mkdir -p "$RUNNER_TEMP/Payload"
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData" -name "location-spoofer.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: location-spoofer.app not found in DerivedData!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"
          zip -qr mkusha-unsigned.ipa Payload
          echo "Created unsigned IPA successfully:"
          ls -lh mkusha-unsigned.ipa

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mkusha-unsigned-ipa
          path: ${{ runner.temp }}/mkusha-unsigned.ipa
          retention-days: 30

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/xcode_build.log
          retention-days: 7
