name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build Go static library
        run: |
          cd GoSpoofer
          chmod +x make.sh
          ./make.sh

      - name: Build and Package (unsigned)
        run: |
          xcodebuild build \
            -project location-spoofer.xcodeproj \
            -scheme location-spoofer \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

          mkdir -p "$RUNNER_TEMP/Payload"
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphoneos" -maxdepth 1 -name "*.app" | head -1)
          echo "Found compiled app at: $APP_PATH"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"
          zip -qr mkusha-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mkusha-unsigned-ipa
          path: ${{ runner.temp }}/mkusha-unsigned.ipa
          retention-days: 30
