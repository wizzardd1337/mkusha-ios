name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build Go static library
        run: |
          cd GoSpoofer
          chmod +x make.sh
          ./make.sh

      - name: Build and Package (unsigned)
        run: |
          xcodebuild archive \
            -project location-spoofer.xcodeproj \
            -scheme location-spoofer \
            -archivePath "$RUNNER_TEMP/mkusha.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION=YES \
            2>&1 | tee "$RUNNER_TEMP/xcode_error.txt"

          mkdir -p "$RUNNER_TEMP/Payload"
          APP_PATH=$(find "$RUNNER_TEMP/mkusha.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Failed to find .app in archive, trying DerivedData..."
            APP_PATH=$(find "$RUNNER_TEMP" -name "*.app" | head -1)
          fi
          echo "Using App: $APP_PATH"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"
          zip -qr mkusha-unsigned.ipa Payload

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mkusha-unsigned-ipa
          path: ${{ runner.temp }}/mkusha-unsigned.ipa
          retention-days: 30

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/xcode_error.txt
          retention-days: 7
