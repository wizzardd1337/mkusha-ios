name: location-spoofer
options:
  bundleIdPrefix: com.mkusha
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

packages:
  SwiftNIO:
    url: https://github.com/apple/swift-nio
    from: "2.0.0"
  swift-log:
    url: https://github.com/apple/swift-log
    from: "1.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    PROVISIONING_PROFILE_SPECIFIER: ""

targets:
  location-spoofer:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mkusha.ios
        PRODUCT_NAME: mkusha
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/location-spoofer.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "$(inherited)"
    dependencies:
      - target: location-spoofer-tunnel
        embed: true
        codeSign: true
      - target: location-spoofer-widget
        embed: true
        codeSign: true
      - sdk: ActivityKit.framework

  location-spoofer-tunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
        excludes:
          - "**/.DS_Store"
      - path: GoSpoofer
        excludes:
          - "**/*.go"
          - "**/*.sh"
          - "build/**"
          - "go.mod"
          - "go.sum"
          - "CGoLocationSpoofer.modulemap"
          - "libgolocationspoofer.a"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mkusha.ios.tunnel
        PRODUCT_NAME: mkusha-tunnel
        INFOPLIST_FILE: Tunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tunnel/location-spoofer-tunnel.entitlements
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/GoSpoofer"
        SWIFT_OBJC_BRIDGING_HEADER: "Tunnel/location-spoofer-tunnel-Bridging-Header.h"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lgolocationspoofer"
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/GoSpoofer/build"
    dependencies:
      - package: SwiftNIO
        product: NIOPosix
      - package: swift-log
        product: Logging
      - sdk: NetworkExtension.framework

  location-spoofer-widget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mkusha.ios.widget
        PRODUCT_NAME: MkushaWidget
        INFOPLIST_FILE: Widgets/Info.plist
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework

schemes:
  location-spoofer:
    build:
      targets:
        location-spoofer: all
        location-spoofer-tunnel: all
        location-spoofer-widget: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  location-spoofer-debug:
    build:
      targets:
        location-spoofer: all
        location-spoofer-tunnel: all
        location-spoofer-widget: all
    run:
      config: Debug
      commandLineArguments:
        "-FIRDebugEnabled": true
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  location-spoofer-tunnel:
    build:
      targets:
        location-spoofer-tunnel: all
    run:
      config: Debug
      commandLineArguments:
        "-NEDebugTunnel": true
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
